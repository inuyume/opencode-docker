services:
  opencode:
    image: ${OPENCODE_IMAGE:-ghcr.io/inuyume/opencode:latest}
    command: ["opencode", "serve", "--hostname", "0.0.0.0", "--port", "4096"]
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?Set OPENAI_BASE_URL in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set OPENCODE_SERVER_PASSWORD in .env}
      TZ: Asia/Shanghai
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${OPENCODE_PORT:-4096}:4096"
    volumes:
      - ./workspace:/workspace
      - opencode-config:/root/.config/opencode
      - opencode-cache:/root/.cache/opencode
      - opencode-data:/root/.local/share/opencode
      - opencode-state:/root/.local/state/opencode
    working_dir: /workspace
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,urllib.request,base64,json;
          auth=base64.b64encode((os.environ.get('OPENCODE_SERVER_USERNAME','opencode')+':'+os.environ['OPENCODE_SERVER_PASSWORD']).encode()).decode();
          req=urllib.request.Request('http://127.0.0.1:4096/api/info',headers={'Authorization':'Basic '+auth});
          data=json.load(urllib.request.urlopen(req,timeout=5));
          assert data.get('version','').startswith('2.')
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  opencode-config:
  opencode-cache:
  opencode-data:
  opencode-state:
